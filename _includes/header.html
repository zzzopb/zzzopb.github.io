<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-name">{{ site.title }}</span>
      <span class="brand-tag">{{ site.tagline }}</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <ul>
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a></li>
        {% for s in site.sections %}{% if s.live %}
        <li><a href="{{ '/' | append: s.key | append: '/' | relative_url }}"{% if page.url contains s.key %} aria-current="page"{% endif %}>{{ s.name }}</a></li>
        {% endif %}{% endfor %}
        <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a></li>
      </ul>
    </nav>
    <div class="reader-tools" role="group" aria-label="阅读设置">
      <button type="button" class="tool" data-font-step="-1" aria-label="缩小字号">A−</button>
      <span class="font-now" id="font-now">字号：标准</span>
      <button type="button" class="tool" data-font-step="1" aria-label="放大字号">A＋</button>
      <span class="visually-hidden" id="font-say" aria-live="polite"></span>
      <button type="button" class="tool" id="theme-toggle" aria-label="切换高对比度配色" aria-pressed="false">高对比</button>
    </div>
  </div>
</header>
